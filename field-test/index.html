<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gyosoku — Field test</title><link rel="stylesheet" href="/src/predictions.css"><link rel="stylesheet" href="/src/field-conditions.css"></head><body><header><a href="/fisherman/">Gyosoku 魚測</a><button id="language" type="button">English</button></header><main><p class="eyebrow" data-en="FISHERMAN FIELD TEST" data-ja="漁業者向けの試用"></p><h1 data-en="Would this help your work?" data-ja="仕事で使えそうですか？"></h1><p class="lead" data-en="Try these three tasks together with a fisherman. Record what works and what needs changing." data-ja="漁業者と一緒に、3つの操作を試してください。使いやすい点と改善が必要な点を記録しましょう。"></p><div class="field-task"><strong data-en="1. Enter an expected catch" data-ja="1. 漁獲量の見込みを入力"></strong><p data-en="Choose the fish, quantity, landing date and port. Review before saving." data-ja="魚種、量、水揚げ日、港を選び、内容を確認して保存してください。"></p><a href="/fisherman/" target="_blank" rel="noopener noreferrer" data-en="Open the app in another tab ↗" data-ja="別のタブでアプリを開く ↗"></a></div><div class="field-task"><strong data-en="2. Find and change the entry" data-ja="2. 入力した記録を見つけて変更"></strong><p data-en="Return to Today, open your entry and change the quantity. Could you do this without help?" data-ja="「今日」の画面に戻り、記録を開いて量を変更してください。説明なしで操作できましたか？"></p></div><div class="field-task"><strong data-en="3. Review the public outlook" data-ja="3. 公開データの見通しを確認"></strong><p data-en="Look at the wind, rain and offshore waves on Today. Is the information useful, and is the date clear?" data-ja="「今日」の風、雨、沖合の波の予報をご確認ください。情報は役立ちますか？日付は分かりやすいですか？"></p></div>
<form id="survey" class="entry field-survey"><h2 data-en="Record the feedback" data-ja="感想を記録"></h2><label for="useful" data-en="Would you use this for work?" data-ja="仕事で使いたいですか？"></label><select id="useful" required><option value="" data-en="Choose one" data-ja="選択してください"></option><option value="yes" data-en="Yes" data-ja="はい"></option><option value="changes" data-en="With changes" data-ja="改善すれば"></option><option value="no" data-en="Not yet" data-ja="まだ使わない"></option></select><label for="ease" data-en="Could you complete the tasks?" data-ja="操作を完了できましたか？"></label><select id="ease" required><option value="" data-en="Choose one" data-ja="選択してください"></option><option value="alone" data-en="Without help" data-ja="説明なしでできた"></option><option value="help" data-en="With help" data-ja="説明があればできた"></option><option value="unable" data-en="Could not finish" data-ja="完了できなかった"></option></select><label for="changes" data-en="What needs changing? (optional)" data-ja="改善してほしい点（任意）"></label><textarea id="changes" maxlength="1000"></textarea><p class="muted" data-en="No name is needed. Saved on this device; export the feedback when you are ready to review it." data-ja="氏名は不要です。この端末に保存されます。確認したいときに感想をダウンロードできます。"></p><button class="primary" type="submit" data-en="Save feedback" data-ja="感想を保存"></button><p id="message" class="field-message" role="status"></p><button id="export" class="field-export" type="button" data-en="Download feedback (JSON)" data-ja="感想をダウンロード（JSON）"></button><p id="count" class="muted"></p></form></main><script type="module" src="/src/field-test.js"></script></body></html>
